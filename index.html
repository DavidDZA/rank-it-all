<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12121a" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Rank It All</title>
    <style>
      /* Écran de chargement, affiché avant l'appli : la page se dessine tout de suite (l'écran de lancement de
         l'appli Android disparaît alors) et un message remplace l'attente si l'appli ne démarre pas. */
      html,
      body {
        margin: 0;
        background: #100d1f;
        color: #f6f4ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      #boot img {
        width: 72px;
        height: 72px;
      }
      #boot p {
        margin: 0;
        color: #aaa4ca;
        max-width: 22rem;
        line-height: 1.4;
      }
      #boot button {
        font: inherit;
        color: #f6f4ff;
        background: linear-gradient(135deg, #ff5fa2, #ff9f43);
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <img src="icons/favicon.svg" alt="" />
        <p id="boot-text">Chargement…</p>
      </div>
    </div>
    <script>
      // Textes de l'écran de chargement dans la langue de l'appli (celle choisie, sinon celle de l'appareil, sinon
      // l'anglais : même règle que src/i18n/index.ts, qui n'est pas encore chargé ici).
      var BOOT = {
        fr: ['Chargement…', 'L’appli ne démarre pas. Vérifie ta connexion et que Chrome est à jour, puis réessaie.', 'Réessayer'],
        en: ['Loading…', 'The app won’t start. Check your connection and that Chrome is up to date, then try again.', 'Try again'],
        es: ['Cargando…', 'La app no arranca. Revisa tu conexión y que Chrome esté actualizado, y vuelve a intentarlo.', 'Reintentar'],
        de: ['Wird geladen…', 'Die App startet nicht. Prüfe deine Verbindung und ob Chrome aktuell ist, und versuch es noch einmal.', 'Erneut versuchen'],
        it: ['Caricamento…', 'L’app non si avvia. Controlla la connessione e che Chrome sia aggiornato, poi riprova.', 'Riprova'],
        pt: ['Carregando…', 'O app não abre. Confira sua conexão e se o Chrome está atualizado, depois tente de novo.', 'Tentar de novo'],
      };
      var bootLang = (function () {
        try {
          var chosen = localStorage.getItem('app-lang');
          if (BOOT[chosen]) return chosen;
        } catch (e) {}
        var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
        for (var i = 0; i < prefs.length; i++) {
          var base = String(prefs[i]).toLowerCase().split(/[-_]/)[0];
          if (BOOT[base]) return base;
        }
        return 'en';
      })();
      document.documentElement.lang = bootLang;
      document.getElementById('boot-text').textContent = BOOT[bootLang][0];
      // Installation (nom, description) dans la langue de l'appli : manifeste traduit (voir vite.config.ts).
      if (bootLang !== 'fr') {
        var manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.setAttribute('href', manifest.getAttribute('href').replace('manifest.webmanifest', 'manifest-' + bootLang + '.webmanifest'));
      }
      // L'appli remplace #boot dès qu'elle s'affiche. Toujours là au bout de 15 s : elle n'a pas démarré.
      setTimeout(function () {
        var boot = document.getElementById('boot');
        if (!boot) return;
        document.getElementById('boot-text').textContent = BOOT[bootLang][1];
        var again = document.createElement('button');
        again.textContent = BOOT[bootLang][2];
        again.onclick = function () {
          location.reload();
        };
        boot.appendChild(again);
      }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
