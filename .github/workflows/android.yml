name: Appli Android

# Compile l'appli Android (TWA, projet dans android/) et la signe avec la clé de dépôt Google Play :
# rank-it-all.aab (à envoyer dans la Play Console) et rank-it-all.apk (installation directe, pour tester).
# Le contenu de l'appli est le site : une mise à jour du site ne demande PAS de nouvelle version Android.
#
# Secrets : ANDROID_KEYSTORE_BASE64 (clé upload-key.p12 encodée en base64) et ANDROID_KEYSTORE_PASSWORD.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "Secrets ANDROID_KEYSTORE_* manquants"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-key.p12"
          out=android/app/build/outputs
          jarsigner -keystore "$RUNNER_TEMP/upload-key.p12" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar rank-it-all.aab "$out/bundle/release/app-release.aab" upload
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/zipalign" -p -f 4 "$out/apk/release/app-release-unsigned.apk" aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/upload-key.p12" --ks-type PKCS12 --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias upload --out rank-it-all.apk aligned.apk
          rm "$RUNNER_TEMP/upload-key.p12" aligned.apk
          jarsigner -verify rank-it-all.aab | tail -1
          "$tools/apksigner" verify --print-certs rank-it-all.apk | grep -i sha-256

      - uses: actions/upload-artifact@v4
        with:
          name: rank-it-all-android
          path: |
            rank-it-all.aab
            rank-it-all.apk
          retention-days: 30
          if-no-files-found: error
